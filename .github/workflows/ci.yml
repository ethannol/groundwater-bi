name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Build warehouse (dbt models + tests)
        run: make build
      - name: Validate LookML against the built schema
        run: uv run pytest -q
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            warehouse/target/manifest.json
            warehouse/target/run_results.json
